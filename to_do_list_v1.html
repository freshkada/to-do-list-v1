<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do list</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        main {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            gap: 3rem;
            margin-bottom: 10rem;
        }

        #add-task-btn {
            background-color: rgb(10, 140, 169);
            color: white;
            font-size: 1.7rem;
            
            padding: 0.8rem 1.2rem;
            border-radius: 20px;
        }
        #add-task-btn:hover {
            cursor: pointer;
        }

        #display {
            height: 500px;
            width: 900px;

            background-color: black;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 50px;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.6);
        }
        fieldset {
            border: none;
        }

        #close-dialog-btn {
            background-color: red;
            color: red;
            font-size: 14px;
            
            width: fit-content;
            height: fit-content;

            position: absolute;
            right: 0.2rem;
            top: 0.2rem;
            
            border-radius: 100%;
            padding: 0.1rem 0.5rem;
        }
        #close-dialog-btn:hover {
            cursor: pointer;
        }

        #submit-button {

        }

        .single-task {
            background-color: white;
            color: black;
            width: fit-content;
            height: fit-content;
            padding: 2rem;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <main>
        <h1>To-Do list v1</h1>
        <div id="display">
            
        </div>
        <div id="add-task-btn">Add Task</div>
        <dialog>
            <div id="close-dialog-btn">x</div>
            <form>
                <fieldset>
                    <legend>Add a task</legend>
                    <div class="form-box">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required />
                    </div>
                    <div class="form-box">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" required />
                    </div>
                    <div class="form-box">
                        <label for="date">Due Date</label>
                        <input type="date" id="date" name="date" />
                    </div>
                    <div class="form-box">
                        <label for="priority">Priority</label>
                        <select name="priority" id="priority">
                            <option value="low">Low</option>
                            <option value="normal">Normal</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-button">Add Task</button>
                </fieldset>
            </form>
        </dialog>
    </main>

    <script>
        const display = document.querySelector("#display");
        const addBtn = document.querySelector("#add-task-btn");
        const form = document.querySelector("form");

        const dialogWindow = document.querySelector("dialog");
        const closeDialogBtn = document.querySelector("#close-dialog-btn")
        const submitBtn = document.querySelector("#submit-button");

        let tasks = [];

        function renderTasks() {

            display.innerHTML = "";

            tasks.forEach(task => {
                const singleTask = document.createElement("div");
                singleTask.className = "single-task";

                singleTask.innerHTML = `
                    <h3>${task.title}</h3>
                    <p>${task.description}</p>
                    <p>due to: ${task.date}</p>
                    <p>priority: ${task.priority}</p>
                `;

                display.appendChild(singleTask);
            });

            
        }

        function Task(title, description, date, priority) {
            this.title = title;
            this.description = description;
            this.date = date;
            this.priority = priority;
            this.completed = false;
        };

        function addTask(title, description, date, priority) {
            const task = new Task(title, description, date, priority);
            tasks.push(task);
        };

        addBtn.addEventListener("click", () => {
            dialogWindow.showModal();
        });

        closeDialogBtn.addEventListener("click", () => {
            dialogWindow.close();
        });

        submitBtn.addEventListener("click", (event) => {
            event.preventDefault();

            const title = document.querySelector("#title").value;
            const description = document.querySelector("#description").value;
            const date = document.querySelector("#date").value;
            const priority = document.querySelector("#priority").value;

            addTask(title, description, date, priority);

            dialogWindow.close();

            form.reset();

            renderTasks();
        })
    </script>
</body>
</html>
